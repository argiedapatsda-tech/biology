<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<title>ExamLock</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='14' width='20' height='15' rx='5' fill='%238fb3ff'/%3E%3Cpath d='M11 14v-4a5 5 0 0 1 10 0v4' fill='none' stroke='%23dfe6f5' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  body { min-height: 100dvh; }
  #hero { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; z-index: 2; }
  .home { position: relative; z-index: 5; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: max(240px, 38vh) 16px max(32px, 5vh); text-align: center; }
  .brand { position: fixed; top: 22px; left: 24px; z-index: 6; display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 18px; }
  .brand-dot { width: 22px; height: 22px; border-radius: 7px; background: linear-gradient(140deg, #dfe6f5, #8fb3ff 60%, #b59cff); box-shadow: 0 0 20px rgba(143,179,255,.5); }
  h1 { font-family: var(--display); font-weight: 800; font-size: clamp(36px, 6vw, 64px); letter-spacing: -.04em; line-height: 1; margin: 0 0 12px; }
  .sub { margin: 0 0 30px; font-size: 17px; line-height: 1.5; }
  .doors { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: min(640px, 100%); }
  .door { display: grid; gap: 6px; justify-items: start; text-align: left; padding: 24px; text-decoration: none; color: var(--text); transition: transform .3s var(--ease), border-color .3s; animation: rise .9s var(--ease) both; }
  .door:nth-child(2) { animation-delay: .08s; }
  .door:hover { transform: translateY(-4px); border-color: var(--stroke-2); }
  .door svg { width: 30px; height: 30px; fill: none; stroke: var(--accent); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; margin-bottom: 8px; }
  .door b { font-family: var(--display); font-size: 22px; letter-spacing: -.02em; }
  .door span { color: var(--muted); font-size: 14.5px; line-height: 1.5; }
  .door em { font-style: normal; margin-top: 10px; font-family: var(--display); font-weight: 600; font-size: 14px; color: var(--accent); }
  @media (max-width: 560px) { .doors { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<canvas id="hero"></canvas>
<div class="noise"></div>
<div class="brand"><span class="brand-dot"></span>ExamLock</div>
<main class="home">
  <h1>Tests that stay locked.</h1>
  <p class="sub muted">Students take the test on their iPad. You see every screen, live.</p>
  <div class="doors">
    <a class="door glass" href="student.html">
      <svg viewBox="0 0 24 24"><rect x="5" y="2.5" width="14" height="19" rx="3"/><path d="M10.5 18.5h3"/></svg>
      <b>I'm a student</b><span>Join a test with the code from your teacher.<br>เข้าสอบด้วยรหัสจากครู</span><em>Join test →</em>
    </a>
    <a class="door glass" href="teacher.html">
      <svg viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="13" rx="2.5"/><path d="M8 21h8M12 17v4"/></svg>
      <b>I'm the teacher</b><span>Make tests, start them, and watch the class live.</span><em>Open dashboard →</em>
    </a>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script src="assets/common.js"></script>
<script src="assets/fx.js"></script>
<script>
  // fit the lock into the free space above the headline, whatever the screen size
  const hero = FX.lock(document.getElementById('hero'), (w, h) => {
    const top = Math.max(120, document.querySelector('h1').getBoundingClientRect().top + window.scrollY - 24);
    const space = Math.min(top, h * 0.6);
    return { x: 0, y: 0.5 - (space / 2 + 6) / h, size: Math.max(0.16, (space * 0.82) / h) };
  });
  document.fonts && document.fonts.ready.then(() => hero.relayout());
  let open = false;
  setInterval(() => { open = !open; hero.setOpen(open); }, 2600);
</script>
</body>
</html>
