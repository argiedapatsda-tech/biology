const qs = new URLSearchParams(location.search);
let cur = qs.get('v') || 'A';
function render() {
  document.getElementById('screens').innerHTML = V[cur]();
  document.querySelectorAll('[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === cur));
  history.replaceState(null, '', `?v=${cur}&font=${encodeURIComponent(getComputedStyle(document.documentElement).getPropertyValue('--f').trim().replace(/"/g, ''))}`);
}
document.querySelectorAll('[data-v]').forEach(b => b.addEventListener('click', () => { cur = b.dataset.v; render(); scrollTo(0, 0); }));
const fsel = document.getElementById('font');
fsel.addEventListener('change', () => { document.documentElement.style.setProperty('--f', `"${fsel.value}"`); render(); });
if (qs.get('font')) { fsel.value = qs.get('font'); document.documentElement.style.setProperty('--f', `"${fsel.value}"`); }
render();
fetch('img/credits.json').then(r => r.json()).then(c => {
  document.getElementById('credits').innerHTML = 'Photos from Wikimedia Commons: ' + Object.values(c).map(x => `<a href="${x.page}" target="_blank">${x.title.replace('File:', '')}</a> (${x.artist}, ${x.license})`).join(' · ');
}).catch(() => {});
</script>
